# YData — S&DS 123 — Fall 2026
# Source-of-truth environment specification.
#
#
# FALLBACK VARIANT: identical to ydata_fa26.yml except pandas is held at 2.x.
# Kept tested and ready so the course can switch pins in one line if a
# pandas-3 problem surfaces mid-semester.
# This file pins MAJOR versions only. Exact, fully-reproducible pins for each
# platform are generated from this file into environment/locks/.
# Students should normally install from their platform's lock file; this file
# is the spec those locks are built from.
#
# Changes from ydata_2025spring_v2.yml (Spring 2025):
#   - python pinned to 3.12 (was unpinned in v1, 3.12 in v2)
#   - numpy/pandas majors pinned so everyone is on the same version
#   - REMOVED `datascience` (pip): verified unused — 0 imports, 0 Table() uses
#     across all 75 course notebooks. It was vestigial from the pre-2024 course.
#   - REMOVED tensorflow / torch / torchvision / torchaudio: no course notebook
#     imports them. This also removes the `--index-url` defect in v2, where that
#     flag applied globally to the whole pip section and would have redirected
#     resolution of every other pip package to the PyTorch CPU index.
#   - ADDED requests: imported by course notebooks AND by the YData package
#     itself, but was never declared anywhere.
#   - ADDED folium, contextily, geopy, mapclassify: used by the mapping classes
#     and previously arriving only as transitive deps of geoplot/datascience.
#   - ADDED openpyxl: needed to read .xlsx data files.
#   - YData package pinned to a release tag rather than /tarball/master, so the
#     package cannot change underneath students mid-semester.

name: ydata_fa26_fallback
channels:
  - conda-forge
dependencies:
  # ---- interpreter -------------------------------------------------------
  - python=3.12

  # ---- core scientific stack (majors pinned) -----------------------------
  - numpy>=2,<3
  - pandas>=2.3,<3
  - scipy>=1.14
  - statsmodels>=0.14
  - scikit-learn>=1.5
  - scikit-image>=0.24
  - sympy
  - numexpr

  # ---- plotting ----------------------------------------------------------
  - matplotlib>=3.9
  - seaborn>=0.13
  - plotly>=6
  - bokeh

  # ---- geospatial --------------------------------------------------------
  - geopandas>=1.0
  - geoplot
  - folium
  - contextily
  - geopy
  - mapclassify

  # ---- data access -------------------------------------------------------
  - requests
  - beautifulsoup4
  - soupsieve
  - pandas-datareader
  - openpyxl
  - pycurl
  - polars
  - dask

  # ---- imaging -----------------------------------------------------------
  - pillow
  - imageio

  # ---- jupyter -----------------------------------------------------------
  - jupyterlab
  - jupyterlab_server
  - notebook
  - ipykernel
  - ipython
  - ipywidgets
  - jupyter_client
  - jupyter_core
  - nb_conda_kernels
  - nbconvert
  - nbformat
  - send2trash

  # ---- authoring / PDF export -------------------------------------------
  # conda-forge `quarto` ships the full Quarto CLI.
  # NOTE: no linux-aarch64 build exists on conda-forge; on ARM Linux install
  # Quarto from the upstream linux-arm64 tarball instead.
  - quarto

  - pip
  - pip:
      - https://github.com/lederman/YData_package/archive/refs/tags/v0.2.0.tar.gz
